name: bump.sh

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Group name'
        required: true
        type: choice
        options:
          - cosmic
          - cosmic-minimal
          - dux
          - hypr
          - nwg
          - sonic
          - xlibre
          - xlibre-minimal
          - test
      bump:
        description: 'Bump (u/--bump)'
        required: false
        default: false
        type: boolean
      lint:
        description: 'Lint (l/--lint)'
        required: false
        default: false
        type: boolean
      build:
        description: 'Build (b/--build)'
        required: false
        default: false
        type: boolean
      copy:
        description: 'Copy templates (c/--copy)'
        required: false
        default: false
        type: boolean
      order:
        description: 'Show build order (o/--order)'
        required: false
        default: false
        type: boolean
      record_order:
        description: 'Record build order (r/--record-order)'
        required: false
        default: false
        type: boolean
      xbps_target_arch:
        description: 'XBPS target architecture'
        required: false
        default: x86_64
        type: string
      xbps_distdir:
        description: 'Path to void-packages checkout (XBPS_DISTDIR)'
        required: false
        default: /void-packages
        type: string
      source_dir:
        description: 'Source packages dir (sourceDir); default <xbps_distdir>/srcpkgs'
        required: false
        default: ''
        type: string
      destination_dir:
        description: 'Destination packages dir (destinationDir); default <repo>/srcpkgs'
        required: false
        default: ''
        type: string
      extra_args:
        description: 'Extra arguments appended to bump.sh'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: bump.sh ${{ inputs.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/osowoso/oco-builder-x86_64:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.BOT }}
    defaults:
      run:
        working-directory: extra
    env:
      XBPS_TARGET_ARCH: ${{ inputs.xbps_target_arch }}
      XBPS_DISTDIR: ${{ inputs.xbps_distdir }}
      OCO_TOKEN: ${{ secrets.BOT }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.BOT }}
          path: extra

      - name: Configure git identity
        run: |
          git config user.name "oSoWoSo-bot"
          git config user.email "bot@osowoso.org"
          git config --global user.name "oSoWoSo-bot"
          git config --global user.email "bot@osowoso.org"

      - name: Resolve paths
        id: paths
        run: |
          srcdir="${{ inputs.source_dir }}"
          destdir="${{ inputs.destination_dir }}"
          if [ -z "$srcdir" ]; then srcdir="${XBPS_DISTDIR}/srcpkgs"; fi
          if [ -z "$destdir" ]; then destdir="${GITHUB_WORKSPACE}/extra/srcpkgs"; fi
          echo "sourceDir=$srcdir" >> "$GITHUB_OUTPUT"
          echo "destinationDir=$destdir" >> "$GITHUB_OUTPUT"

      - name: Require at least one operation
        run: |
          if [ "${{ inputs.bump }}" != "true" ] && [ "${{ inputs.lint }}" != "true" ] && \
             [ "${{ inputs.build }}" != "true" ] && [ "${{ inputs.copy }}" != "true" ] && \
             [ "${{ inputs.order }}" != "true" ] && [ "${{ inputs.record_order }}" != "true" ]; then
            echo "::error::select at least one operation flag"
            exit 1
          fi

      - name: Build args and run bump.sh
        env:
          sourceDir: ${{ steps.paths.outputs.sourceDir }}
          destinationDir: ${{ steps.paths.outputs.destinationDir }}
        run: |
          set -euo pipefail
          args=("${{ inputs.group }}")
          [ "${{ inputs.bump }}" = "true" ] && args+=(--bump)
          [ "${{ inputs.lint }}" = "true" ] && args+=(--lint)
          [ "${{ inputs.build }}" = "true" ] && args+=(--build)
          [ "${{ inputs.copy }}" = "true" ] && args+=(--copy)
          [ "${{ inputs.order }}" = "true" ] && args+=(--order)
          [ "${{ inputs.record_order }}" = "true" ] && args+=(--record-order)
          if [ -n "${{ inputs.extra_args }}" ]; then
            read -ra extra <<< "${{ inputs.extra_args }}"
            args+=("${extra[@]}")
          fi
          printf 'Running: ./bump.sh %s\n' "${args[*]}"
          ./bump.sh "${args[@]}"

      - name: Commit and push changes
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "bump.sh: ${{ inputs.group }}"
          git push origin HEAD:${GITHUB_REF_NAME}